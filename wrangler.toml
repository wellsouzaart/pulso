name = "pulso"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

# Crons BRT→UTC (-3h)
[triggers]
crons = [
  "30 10 * * 1-5",   # 07:30 seg-sex — briefing matinal
  "0 21 * * 5",      # 18:00 sexta   — relatório semanal
  "0 14 * * *"       # 11:00 diário  — verificação proativa
]

[[kv_namespaces]]
binding = "PULSO_KV"
id = "f6b56dbc1b56414b9dcfa6737d7a6764"
